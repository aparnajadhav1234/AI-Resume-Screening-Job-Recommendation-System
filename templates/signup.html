{% extends 'base.html' %}

{% block title %}Sign Up - SkillMatch AI{% endblock %}

{% block content %}
<div class="container section">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header text-center">
                <div class="auth-icon-circle icon-indigo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="23" y1="11" x2="17" y2="11"></line>
                    </svg>
                </div>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Register to analyze resumes, extract skills, and calculate AI job match scores.</p>
            </div>

            <form action="{{ url_for('signup') }}" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" id="name" name="name" class="form-input" placeholder="e.g. John Doe" required value="{{ request.form.get('name', '') }}">
                </div>

                <div class="grid-2col-compact">
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="john@example.com" required value="{{ request.form.get('email', '') }}">
                    </div>

                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" name="username" class="form-input" placeholder="johndoe" required value="{{ request.form.get('username', '') }}">
                    </div>
                </div>

                <div class="grid-2col-compact">
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-input" placeholder="At least 6 characters" minlength="6" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Re-enter password" minlength="6" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    Create Your Account
                </button>
            </form>

            <div class="auth-footer text-center">
                <p>Already have an account? <a href="{{ url_for('login') }}" class="auth-link">Sign In Here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
